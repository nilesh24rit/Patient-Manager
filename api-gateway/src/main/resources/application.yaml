spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: http://patient-service:8081
              predicates:
                - Path=/api/patient/**
              filters:
                - StripPrefix=1

            - id: api-docs-patient-route
              uri: http://patient-service:8081
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients, /v3/api-docs

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: gateway
  endpoint:
    gateway:
      access: unrestricted